[project]
name = "yolo-line-crossing-counter"
version = "0.1.0"
description = "Object Line-Crossing Counter"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.2",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "lapx>=0.5.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: exercises real YOLO inference (needs network for first-run weight download)",
]
